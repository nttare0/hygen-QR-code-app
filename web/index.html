<div class="stage">
  <div class="phone" id="phone">
    <header class="appbar" id="appbar"></header>
    <main class="screen" id="screen" tabindex="-1"></main>
    <nav class="tabbar" id="tabbar" role="tablist" aria-label="Main"></nav>
  </div>
  <aside class="stage-note" id="stage-note" aria-label="Preview notes"></aside>
</div>

<div class="sheet-scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden></div>
<div class="modal" id="modal" role="dialog" aria-modal="true" hidden></div>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<canvas id="decode-canvas" hidden></canvas>

<script src="vendor/qrcode.js"></script>
<script src="vendor/jsQR.js"></script>
<script src="app.js"></script>
